name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      # Proje klasorunu otomatik bul (settings.gradle nerede ise orasi).
      - name: Find project directory
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then echo "settings.gradle bulunamadi"; exit 1; fi
          d=$(dirname "$f")
          echo "Proje klasoru: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar

  release:
    # Sadece "v1.0.0" gibi bir tag push'ladiginda calisir.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar
          generate_release_notes: true
